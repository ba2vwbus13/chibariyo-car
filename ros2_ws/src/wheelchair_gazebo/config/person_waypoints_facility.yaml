# 屋内施設ワールド(facility.world)用の人の巡回ルート
# 廊下 → 談話室 → 廊下 → 食堂 → 廊下 → 居室 → 廊下 → リハビリ室 → 廊下 の順に一周する。
# 出入口の中心を必ず経由するように点を置いてある
# (北側の扉: x=-4.5 と x=4.5 / 南側の扉: x=-5.5 と x=3.0)
person_mover:
  ros__parameters:
    speed: 0.4
    goal_tolerance: 0.2
    waypoints: [ 2.0,  0.0,     # 廊下(スタート)
                 6.5,  0.0,     # 廊下を東へ
                 4.5,  0.2,     # 談話室の入口前
                 4.5,  3.0,     # 談話室に入る
                 8.2,  3.3,     # ローテーブルの東側を回る
                 8.2,  4.9,     # ソファ脇(奥)
                 8.2,  3.3,     # 引き返す
                 4.5,  3.0,
                 4.5,  0.2,     # 廊下へ戻る
                 0.5, -0.6,     # 配膳カートの脇を通過
                -4.5,  0.5,     # 食堂の入口前
                -4.5,  3.0,     # 食堂に入る
                -7.5,  3.5,     # テーブルの間を抜ける
                -4.5,  3.0,     # 引き返す
                -4.5,  0.5,     # 廊下へ戻る
                -5.5, -0.2,     # 居室の入口前
                -5.5, -3.0,     # 居室に入る
                -5.5, -4.5,     # ベッド脇
                -5.5, -3.0,     # 引き返す
                -5.5, -0.2,     # 廊下へ戻る
                 3.0, -0.2,     # リハビリ室の入口前(廊下を東へ)
                 3.0, -3.0,     # リハビリ室に入る
                 1.0, -2.5,     # マット脇
                 3.0, -3.0,     # 引き返す
                 3.0, -0.2]     # 廊下へ戻る(以降ループ)
